# Backend SonarQube Configuration
sonar.projectKey=backend-microservices
sonar.projectName=Backend Microservices
sonar.projectVersion=1.0.0

# Server URL & Auth Token
sonar.host.url=http://localhost:9000
sonar.token=squ_e77c87b99eb839a383fbe0a9cb5660052451dadc

# Source Paths
sonar.sources=apps,libs
sonar.tests=apps,libs
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts,**/*.pbt.spec.ts

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/.nx/**,**/coverage/**,**/tmp/**,**/*.spec.ts,**/*.test.ts,**/.stryker-tmp/**,**/bin/**,**/assets/**,**/.docker-data/**,**/.git/**
sonar.coverage.exclusions=\
  **/*.spec.ts,\
  **/*.test.ts,\
  **/*.pbt.spec.ts,\
  **/main.ts,\
  **/environments/**,\
  **/*.config.ts,\
  **/*.config.js,\
  **/*.config.mjs,\
  **/*.config.cts,\
  **/jest.config.*,\
  **/webpack.config.*,\
  **/eslint.config.*,\
  **/*.module.ts,\
  **/index.ts,\
  **/index.js,\
  **/schemas/**,\
  **/interfaces/**,\
  **/constants/**,\
  **/decorators/**,\
  **/pipes/**,\
  **/dto/index.ts,\
  **/libs/pdf-engine/**,\
  **/gateway-e2e/**,\
  **/test/**

# Test Coverage Integration
sonar.javascript.lcov.reportPaths=coverage/merged-lcov.info

# TypeScript Config
sonar.typescript.tsconfigPaths=tsconfig.base.json

# General
sonar.sourceEncoding=UTF-8
